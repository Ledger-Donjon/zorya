[package]
name = "zorya"
version = "0.0.5"
edition = "2021"
default-run = "zorya"

[features]
# Built-in plugin gates. Each plugin's source still compiles into the
# library unconditionally (so `cargo test` covers them), but its
# automatic registration in `crate::plugins::registry::register_default`
# is feature-gated so users can ship a stripped-down engine.
default = ["plugin-volos", "plugin-chancheck", "plugin-toctou"]
plugin-volos = []
plugin-chancheck = []
plugin-toctou = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Main binary: Zorya concolic executor
[[bin]]
name = "zorya"
path = "src/main.rs"

# Additional tool: Fuzzer for automated test campaigns
[[bin]]
name = "zorya-fuzzer"
path = "src/fuzzer/main.rs"

# MCP server for autonomous binary analysis via Cursor / Claude Code
[[bin]]
name = "zorya-mcp"
path = "src/mcp/main.rs"

[dependencies]
z3 = "0.12.1"
parser = { path = "external/pcode-parser" }
goblin = "0.10.5"
lazy_static = "1.4.0"
ethnum = "1.5.3"
regex = "1.12.3"
anyhow = "1.0.81"
gdbstub = "0.7.10"
once_cell = "1.21.4"
memmap = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.21"
z3-sys = "0.8.1"
nix = "0.31.3"
libc = "0.2.159"
byteorder = "1.5.0"
faerie = "0.16.0"
target-lexicon = "0.13.5"
shell-words = "1.1.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
chrono = "0.4.44"
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
schemars = "1"
