# TOCTOU detector plugin manifest
# SPDX-License-Identifier: Apache-2.0

name: toctou
version: 0.0.5
description: >
  Detects time-of-check-time-of-use race conditions at the syscall level.
  Targets patterns like SO_PEERCRED→readlink(/proc/pid/exe), stat→open,
  and access→open where a race window allows resource substitution.

subscriptions:
  - Syscall
  - SyscallRet
  - Call
  - ThreadSwitch

# In addition to the events above, the plugin implements the on_overlay_end
# lifecycle hook to evaluate checks reached only during overlay concolic
# execution of an untaken (input-gated) branch. See the overlay-check-reachable
# rule below.

environment:
  TOCTOU_VERBOSE: "Verbose by default (1). Set to 0 to suppress per-event log messages."

rules:
  - id: check-use-race
    severity: Critical (with thread switch) / Error (without)
    description: >
      A security-sensitive property was checked and then used with a race
      window between the two operations, both observed on the analyzed path.
      An attacker who can influence the resource in that window (PID recycling,
      symlink swap, file rename) can bypass the check.

  - id: overlay-check-reachable
    severity: High
    requires: "--negate-path-exploration (NEGATE_PATH_FLAG=true)"
    description: >
      A credential check (getsockopt SO_PEERCRED) was proven reachable on an
      untaken, input-gated branch via overlay concolic execution, and the input
      that reaches it was solved with Z3. The paired use (readlink /proc/<pid>/exe)
      was not executed concretely in the overlay, so this is reported as a
      *potential* TOCTOU together with the triggering input. Only SO_PEERCRED is
      flagged from a lone check, since the peer PID is meaningless without a
      subsequent identity use.

patterns:
  - name: peercred-readlink
    check: "getsockopt(fd, SOL_SOCKET, SO_PEERCRED)"
    use: "readlinkat(AT_FDCWD, /proc/<pid>/exe)"
    attack: "PID recycling — original process exits, malicious process takes same PID"

  - name: stat-open
    check: "stat(path) / lstat(path) / fstatat(dirfd, path)"
    use: "openat(dirfd, path, flags)"
    attack: "Symlink swap or rename in the race window"

  - name: access-open
    check: "access(path, mode) / faccessat(dirfd, path, mode)"
    use: "openat(dirfd, path, flags)"
    attack: "Permission check bypass via file replacement"
